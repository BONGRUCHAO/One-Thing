name: Convert to APK and upload

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      # 新增：清理可能干扰的文件夹
      - name: Clean up previous build folders
        run: rm -rf ionic_build_folder

      - name: Convert to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "."
          app-name: "OneThing"
          output-folder-path: "my-apks"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final-apks
          path: my-apks/
