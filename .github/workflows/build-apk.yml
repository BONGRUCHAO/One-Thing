name: Convert to APK and upload

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]   # 使用较新的 Node 版本
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # 移除了 cache，因为项目没有 package.json
      
      # 如果你确实需要运行 npm install（比如有构建工具），可以添加
      # - run: npm install
      # - run: npm run build
      
      - name: Convert to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "."
          app-name: "OneThing"
          output-folder-path: "my-apks"
      
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: Final-apks
          path: my-apks/
