name: Convert to APK and upload

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - uses: actions/checkout@v4  # 建议也升级到 v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      # 如果你需要构建（比如用 npm run build），取消下面两行的注释
      # - run: npm install
      # - run: npm run build
      
      - name: Convert to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "."
          app-name: "OneThing"
          output-folder-path: "my-apks"
      
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4  # ✅ 已升级到 v4
        with:
          name: Final-apks
          path: my-apks/
