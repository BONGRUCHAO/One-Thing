name: Convert to APK and upload

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x          # 🔥 升级到 22.x，满足 Capacitor 要求
      
      - name: Convert to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "www"    # 你的网页文件夹（已创建）
          app-name: "OneThing"        # 应用名称
          # 注意：此 Action 不支持 app-id，已移除
          output-folder-path: "my-apks"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final-apks
          path: my-apks/
