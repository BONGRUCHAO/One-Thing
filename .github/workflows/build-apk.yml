name: Convert to APK and upload

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      
      - name: Convert to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "www"          # 🔥 关键：只打包 www 文件夹
          app-name: "OneThing"              # 你的 App 名称
          app-id: "com.yourcompany.onething" # 可选：包名（如果不指定，工具会自动生成）
          output-folder-path: "my-apks"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final-apks
          path: my-apks/
