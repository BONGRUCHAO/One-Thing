name: Build Android APK (Manual)

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # 🔥 关键修复：安装 Java 21（Capacitor 7+ 要求）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # 推荐使用 Eclipse Temurin（原 AdoptOpenJDK）
          java-version: '21'

      - name: Initialize npm project
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/cli @capacitor/core
          npm install @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init OneThing com.yourcompany.onething --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build Android APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
